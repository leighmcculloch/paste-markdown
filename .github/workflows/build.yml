name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Paste Markdown.app
          path: build/Paste Markdown.app
